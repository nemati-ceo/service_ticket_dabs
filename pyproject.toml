# For more information, see the setuptools documentation:
# https://setuptools.pypa.io/en/latest/userguide/declarative_config.html
[project]
name = "ServiceTicket"
version = "0.1.0.dev13"
description = "Generated project using the NML Ops Stack"
requires-python = ">=3.10"
readme = "README.md"
authors = [
    { name = "alinemati@northwesternmutual.com", email = "alinemati@northwesternmutual.com" },
]

dependencies = [
    "databricks-sdk",
    "numpy==2.1.3",
    "pandas>=2.0",
    "scipy>=1.11",
    "PyYAML>=6.0",
    "sentence-transformers>=2.7",
    "nltk>=3.8",
    "tqdm>=4.65",
    "scikit-learn==1.4.2",
    "joblib>=1.3",
    "umap-learn>=0.5",
    "hdbscan>=0.8.33",
    "plotly>=5.18",
    "kaleido>=0.2.1",
    "optimum[onnxruntime]>=1.17",
    "onnxruntime>=1.17",
    "mlflow>=2.11",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    # spaCy MUST be declared here even though presidio already requires it.
    # DBR 18.0 ML ships spacy 3.7.5 + thinc 8.2.4 — both compiled against
    # numpy 1.x — next to its own numpy 2.1.3. presidio's requirement is only
    # `spacy>=3.4.4`, which that broken pair satisfies, so pip skips installing
    # a spacy into cluster_libraries and stage 01b's pandas_udf dies importing
    # thinc with "numpy.dtype size changed ... Expected 96 from C header, got 88
    # from PyObject" (runs 990494003681803, 860803045717239).
    # 3.8 is the first spacy that requires thinc>=8.3.0, the first numpy-2 thinc,
    # and 3.7.5 does not satisfy `>=3.8`, so pip is forced to install it here.
    # Stay inside 3.8.x: the en_core_web_lg staged in the Volume is built for 3.8.
    "spacy>=3.8,<3.9",
]

[tool.pytest.ini_options]
testpaths = ["src/ServiceTicket/tests"]
pythonpath = ["src/ServiceTicket/tests", "src/ServiceTicket"]

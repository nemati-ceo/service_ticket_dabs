# For more information, see the setuptools documentation:
# https://setuptools.pypa.io/en/latest/userguide/declarative_config.html
[project]
name = "ServiceTicket"
version = "0.1.0.dev13"
description = "Generated project using the NML Ops Stack"
requires-python = ">=3.10"
readme = "README.md"
authors = [
    { name = "alinemati@northwesternmutual.com", email = "alinemati@northwesternmutual.com" },
]

dependencies = [
    "databricks-sdk",
    "numpy==2.1.3",
    "pandas>=2.0",
    "scipy>=1.11",
    "PyYAML>=6.0",
    # Unbounded on purpose: a Volume-cached model folder is tied to the version that
    # wrote it, and model_cache.load_cached now re-downloads when the cache won't load.
    "sentence-transformers>=2.7",
    "nltk>=3.8",
    "tqdm>=4.65",
    "scikit-learn==1.4.2",
    "joblib>=1.3",
    "umap-learn>=0.5",
    "hdbscan>=0.8.33",
    "plotly>=5.18",
    "kaleido>=0.2.1",
    "optimum[onnxruntime]>=1.17",
    "onnxruntime>=1.17",
    "mlflow>=2.11",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    # spaCy MUST be declared here even though presidio already depends on it.
    # DBR 18.0 ML ships spacy 3.7.5 + thinc 8.2.4 — both compiled against numpy
    # 1.x — next to its own numpy 2.1.3. presidio only asks for `spacy>=3.4.4`,
    # which that broken pair satisfies, so pip skips installing a spacy into
    # cluster_libraries and stage 01b's pandas_udf dies importing thinc with
    # "numpy.dtype size changed ... Expected 96 from C header, got 88 from
    # PyObject" (runs 990494003681803, 860803045717239).
    # 3.8 is the first spacy requiring thinc>=8.3.0, the first numpy-2 thinc, and
    # 3.7.5 does not satisfy `>=3.8`, so pip is forced to install it here.
    # Stay inside 3.8.x: the en_core_web_lg staged in the Volume is built for 3.8.
    "spacy>=3.8,<3.9",
]

[project.optional-dependencies]
test = [
    "coverage>=5",  # pyproject.toml support
    "pytest>=6",    # pyproject.toml support
    "pytest-env",
    "pytest-mock",
]

dev = [
    "build",
    "bump-my-version",
    "pdoc3",
    "pre-commit",
    "ruff",
    "ServiceTicket[test]",
]


[tool.setuptools.package-data]
"ServiceTicket" = ["*.json", "*.yaml", "*.yml", "*.csv"]
"ServiceTicket.assets.databricks" = ["*.yaml", "*.yml"]


[tool.ruff]
fix = true
line-length = 120
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.pytest.ini_options]
norecursedirs = [
    "migrations"
]
python_files = [
    "test_*.py",
    "*_test.py",
    "tests.py"
]
pythonpath = [
    "src/ServiceTicket/tests"
]
testpaths = [
    "src/ServiceTicket/tests"
]

[tool.coverage.run]
branch = true
command_line = "-m pytest"
data_file = "coverage/.coverage"
source = ["src/ServiceTicket"]
omit = [
    "tests/*",
]

[tool.coverage.html]
directory = "coverage/htmlcov"

[tool.coverage.json]
output = "coverage/coverage.json"

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.bumpversion]
current_version = "0.1.0.dev13"
allow_dirty = true
commit = false
tag = false
parse = """(?x)
    (?P<major>0|[1-9]\\d*)\\.
    (?P<minor>0|[1-9]\\d*)\\.
    (?P<patch>0|[1-9]\\d*)
    (?:
        [-.]                    # separator before pre-release label
        (?P<pre_l>dev|rc)       # pre-release label
        (?P<pre_n>0|[1-9]\\d*)  # pre-release version number
    )?                          # pre-release section is optional
"""
serialize = [
    "{major}.{minor}.{patch}.{pre_l}{pre_n}",
    "{major}.{minor}.{patch}",
]
[tool.bumpversion.parts.pre_l]
values = ["dev", "rc"]
optional_value = "rc"


[[tool.bumpversion.files]]
filename = "src/ServiceTicket/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "src/ServiceTicket/assets/databricks/_variables.yml"
search = "default: {current_version}"
replace = "default: {new_version}"


[build-system]
requires = [
    "pip",
    "setuptools",
    "six",
    "wheel",
]
